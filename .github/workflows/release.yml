# 릴리스 빌드(3 OS, Electron): 태그(v*)를 푸시하면 패키지를 만들어 GitHub Release에 첨부한다.
# Linux = AppImage · Windows = msi · macOS = dmg(Apple Silicon). 서명은 하지 않는다.
# 수동 실행(workflow_dispatch)은 아티팩트만 올린다 — 태그 전에 확인용.
# 릴리스 노트: 세 패키지가 다 붙은 뒤 notes 잡이 docs/release-notes/<태그>.md + SHA-256을 본문으로 올린다.
name: release

# Release를 만들고 파일을 붙이려면 contents: write가 필요하다(기본값 read면 403).
permissions:
  contents: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # 오래된 glibc로 빌드해야 AppImage가 더 많은 배포판에서 돈다
            target: --linux AppImage
            files: release/pokesix-*.AppImage
            name: linux
          - os: windows-2022
            target: --win msi
            files: release/pokesix-*.msi
            name: windows
          - os: macos-14 # Apple Silicon
            target: --mac dmg
            files: release/pokesix-*.dmg
            name: macos
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check (typecheck · lint · format · tests)
        if: matrix.name == 'linux'
        run: npm run check
      - name: Build renderer + main
        run: npm run build && npm run electron:compile
      - name: Package
        shell: bash
        run: npx electron-builder --config platforms/electron/electron-builder.yml ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PokeSix-${{ matrix.name }}
          path: ${{ matrix.files }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.files }}

  # 세 OS 패키지가 모두 붙은 뒤 Release 본문을 채운다: docs/release-notes/<태그>.md(있으면) + 파일들의 SHA-256.
  notes:
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compose the release body
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          {
            if [ -f "$notes" ]; then cat "$notes"; echo; fi
            echo 'SHA-256'
            echo '```'
            (cd dist && sha256sum pokesix-*)
            echo '```'
          } > release-body.md
          cat release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          name: PokeSix ${{ github.ref_name }}
          body_path: release-body.md
