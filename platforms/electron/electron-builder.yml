appId: io.github.reidlo5135.pokesix
productName: PokeSix
executableName: pokesix
copyright: Copyright © 2026 Reidlo5135
directories:
  output: release
  buildResources: platforms/assets
files:
  - dist/**
  - dist-electron/**
  - package.json
  - "!node_modules/**"
artifactName: pokesix-${version}-${os}-${arch}.${ext}
extraMetadata:
  main: dist-electron/main.js
  author:
    name: reidlo
    email: reidlo4215@gmail.com
  homepage: https://github.com/reidlo5135
  desktopName: pokesix.desktop
asar: true
linux:
  target: [AppImage, deb]
  category: Development
  icon: platforms/assets/icon.png
  syncDesktopName: true
deb:
  packageName: pokesix
win:
  target: [msi]
  icon: platforms/assets/icon.png
msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target: [dmg]
  identity: null # 서명 안 함(인증서 없음) — 처음 열 때 우클릭 → 열기
  category: public.app-category.developer-tools
  icon: platforms/assets/icon.png
